[project]
name = "currency-data-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos Michelutti", email = "carlos.stz590@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow==3.3.0; sys_platform != 'win32'",
    "pandas>=2.3,<3",
    "pendulum>=3.2.0",
    "polars>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=21,<22",
    "pydantic-settings>=2.10,<3",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
# Keep the providers bundled in apache/airflow:3.3.0 compatible with the lock.
constraint-dependencies = [
    "cryptography<49",
    "protobuf<7",
    "rich<14",
    "typer<0.26",
    "websockets<17",
    "opentelemetry-sdk~=1.43.0",
]
